# Code ref: https://community.home-assistant.io/t/how-to-waveshare-3-5-lcd-with-st7796-setup/964308
esphome:
  name: wavedisplay
  friendly_name: WaveDisplay

psram:
  mode: octal
  speed: 80MHz

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "[to add]"

ota:
  - platform: esphome
    password: "[to add]"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Wavedisplay Fallback Hotspot"
    password: "3klklCTOn63j"



# I2C bus configuration
i2c:
  - id: i2c_bus
    sda: 8
    scl: 7
    scan: true

# PCA9554 GPIO extender for display reset
pca9554:
  - id: p_c_a
    address: 0x20
    i2c_id: i2c_bus

# Backlight PWM output and light component
output:
    # Backlight LED
  - platform: ledc
    pin: GPIO06
    id: GPIO06
    frequency: 2000Hz
    channel: 0

light:
  - platform: monochromatic
    output: GPIO06
    name: Display Backlight
    id: display_backlight
    restore_mode: ALWAYS_ON
    gamma_correct: 1

spi:
  id: display_spi
  clk_pin: GPIO05
  mosi_pin: GPIO01
  miso_pin: GPIO02
  
display:
  - platform: mipi_spi
    model: st7796
    spi_id: display_spi
    cs_pin:
      pca9554: p_c_a
      number: 2
    dc_pin: 3
    reset_pin:
      pca9554: p_c_a
      number: 1
    rotation: 90
    spi_mode: 1
    color_order: bgr
    pixel_mode: 16bit
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  platform: ft63x6
  transform:
    swap_xy: true
    mirror_x: false
    mirror_y: true
  on_touch:
    - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
              touch.x,
              touch.y,
              touch.x_raw,
              touch.y_raw
              );


lvgl:
  widgets:
    - label:
        align: CENTER
        text: 'Hello World!'

captive_portal:
    
